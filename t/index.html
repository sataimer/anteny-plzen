<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Testy elektrikář</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <h1>Testové otázky pro elektrikáře</h1>
    <p>Zadejte číslo otázky od 1 do 540. Obsah je zveřejňován postupně; nyní jsou zpracované otázky 1–51.</p>
    <form class="finder" data-question-search>
      <input data-question-number type="number" min="1" max="540" inputmode="numeric" placeholder="Číslo otázky" aria-label="Číslo otázky" required autofocus>
      <button type="submit">Přejít</button>
    </form>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
